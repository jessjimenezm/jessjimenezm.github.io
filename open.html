<style>
  :root { --bg: #FAF6F3; --card: #FFFFFF; --text: #1C1917; --muted: #78716C; --border: #EDE4DF; --accent: #B4536A; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151312; --card: #1F1B1A; --text: #F4EEEA; --muted: #A8A29E; --border: #2E2826; --accent: #E8A3B0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'DM Sans', -apple-system, sans-serif; line-height: 1.6; }
  main { max-width: 680px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  header img { width: 48px; height: 48px; border-radius: 12px; }
  header a { color: var(--text); text-decoration: none; font-weight: 700; }
  nav { margin-left: auto; font-size: 14px; }
  nav a { color: var(--muted); margin-left: 14px; font-weight: 500; }
  h1 { font-size: 34px; line-height: 1.15; letter-spacing: -0.8px; margin: 0 0 6px; }
  h2 { font-size: 20px; margin: 28px 0 6px; }
  p { margin: 8px 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 18px 20px; margin-top: 16px; }
  .button { display: inline-block; background: var(--text); color: var(--bg); padding: 12px 22px; border-radius: 999px; text-decoration: none; font-weight: 700; margin: 8px 8px 0 0; }

  a { color: var(--accent); }
  ul { padding-left: 20px; }

</style>
<script>
  // Only app screens: a path of letters, numbers and dashes.
  var path = (location.hash || '').replace(/^#\/?/, '');
  if (!/^[a-z0-9\/-]{0,120}$/i.test(path)) path = '';
  var url = 'jessbetweenmoms://' + path;
  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('open').href = url;
    location.href = url;
  });
</script>
